[package]
name = "andruna-linker"
description = "The ELF loader and dynamic linker for Android ELF code in a Windows process."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "andruna-elf"
path = "src/bin/andruna-elf.rs"

[dependencies]
andruna-binder-device = { path = "../andruna-binder-device" }
andruna-lx = { path = "../andruna-lx" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
]

[lints]
workspace = true
