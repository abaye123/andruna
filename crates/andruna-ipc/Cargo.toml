[package]
name = "andruna-ipc"
description = "The named-pipe protocol between andruna-launch (and the manager) and andruna-sysd."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
]

[lints]
workspace = true
