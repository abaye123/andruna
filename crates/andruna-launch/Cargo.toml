[package]
name = "andruna-launch"
description = "The tiny launcher behind Start menu shortcuts: asks andruna-sysd to start a package."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "andruna-launch"
path = "src/main.rs"

[dependencies]
andruna-ipc = { path = "../andruna-ipc" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
