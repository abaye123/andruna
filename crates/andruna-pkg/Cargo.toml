[package]
name = "andruna-pkg"
description = "The package manager backend: APK parsing, signature verification, install, uninstall and Windows integration."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test support: builders for zip archives, binary XML, resource tables and
# signed APKs. Used by this crate's tests and by andruna-sysd's tests; never
# by shipped code.
testkit = ["dep:rand"]

[dependencies]
crc32fast = "1.5"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", default-features = false, features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p521 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
image-webp = "0.2"
rand = { version = "0.8", optional = true }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
]

[dev-dependencies]
andruna-pkg = { path = ".", features = ["testkit"] }

[lints]
workspace = true
