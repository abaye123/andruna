[package]
name = "andruna-sysd"
description = "The Andruna system server: one per user session, supervises app processes."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "andruna_sysd"
path = "src/lib.rs"

[[bin]]
name = "andruna-sysd"
path = "src/main.rs"

[dependencies]
andruna-binder = { path = "../andruna-binder" }
andruna-ipc = { path = "../andruna-ipc" }
andruna-pkg = { path = "../andruna-pkg" }

[dev-dependencies]
andruna-pkg = { path = "../andruna-pkg", features = ["testkit"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
