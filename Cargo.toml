[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Spikes are throwaway, standalone projects with their own manifests and
# build setup. They are not part of the workspace.
exclude = ["spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
# Nothing is published to crates.io (ADR 0018).
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = "line-tables-only"

# The signal path runs on the faulting guest stack until it switches to the
# alternate stack, with only ART's stack overflow gap (8 KiB on x86_64,
# part of it used by Windows' exception dispatch) below it. Unoptimized
# frames of andruna-lx's exception handler do not fit there, so the two
# crates on that path are optimized in debug builds too.
[profile.dev.package.andruna-lx]
opt-level = 1

[profile.dev.package.andruna-linker]
opt-level = 1

# Signature verification (andruna-pkg) and the test keys its tests generate
# (RSA 2048) take seconds unoptimized; optimize the bignum and curve crates
# in debug builds too.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.primeorder]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
