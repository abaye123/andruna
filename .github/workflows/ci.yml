name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ANDRUNA_LLVM_MINGW: C:\tools\llvm-mingw

jobs:
  rust:
    name: rust (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-gnullvm
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-gnullvm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned version
      # with its components and targets on first use. ARM64 Windows images
      # may not ship rustup, so install it when missing.
      - name: Rust toolchain
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            Remove-Item rustup-init.exe
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup show active-toolchain
          rustc --version

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Cache llvm-mingw
        uses: actions/cache@v4
        with:
          path: C:\tools\llvm-mingw
          key: llvm-mingw-${{ runner.arch }}-${{ hashFiles('xtask/src/toolchain.rs') }}

      # Installs (or verifies) the pinned llvm-mingw and adds its bin
      # directory to PATH for the following steps.
      - name: llvm-mingw
        run: cargo xtask toolchain

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo xtask build --arch ${{ matrix.arch }}

      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }}

  # AOSP layers 1 and 2 (liblog, libbase, libziparchive, libartbase,
  # libdexfile, ...) built with CMake and Ninja. About 25 s per
  # architecture on an 8-thread laptop and 2 minutes on a hosted runner,
  # plus the fetch (cached). The runtime
  # (libart, ICU, libcore natives, the guest bionic) is not built here: it
  # needs most of aosp.lock and takes far longer; it is built on the
  # maintainer's machine with `cargo xtask aosp-build --runtime`.
  aosp:
    name: aosp (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            Remove-Item rustup-init.exe
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup show active-toolchain

      - name: Cache llvm-mingw
        uses: actions/cache@v4
        with:
          path: C:\tools\llvm-mingw
          key: llvm-mingw-${{ runner.arch }}-${{ hashFiles('xtask/src/toolchain.rs') }}

      - name: llvm-mingw
        run: cargo xtask toolchain

      - name: CMake and Ninja
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { python -m pip install ninja }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { python -m pip install cmake }
          cmake --version
          ninja --version

      # The cache holds the pristine checkouts: it is saved right after the
      # fetch, before aosp-build applies patches/, so a changed patch never
      # meets a tree that has an older version of it applied.
      - name: Restore AOSP sources
        id: aosp-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/aosp
          key: aosp-${{ hashFiles('aosp/aosp.lock') }}

      # Only the projects the layers below use. aosp-build skips the
      # patches of projects that are not fetched (libcore, for example).
      - name: Fetch
        run: >
          cargo xtask fetch
          --project art --project bionic --project external/fmtlib
          --project external/googletest --project external/lz4
          --project external/tinyxml2 --project external/zlib
          --project frameworks/libs/modules-utils --project libnativehelper
          --project system/core --project system/libbase
          --project system/libziparchive --project system/logging

      - name: Save AOSP sources
        if: steps.aosp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/aosp
          key: aosp-${{ hashFiles('aosp/aosp.lock') }}

      # The explicit CI target set: every library of layers 1 and 2 in
      # aosp/CMakeLists.txt. Keep it in step with the fetch list above.
      - name: Build
        run: >
          cargo xtask aosp-build --arch ${{ matrix.arch }}
          --target fmtlib --target liblog --target libbase
          --target libcutils --target libutils --target libz
          --target liblz4 --target libziparchive --target libartpalette
          --target libtinyxml2 --target libartbase --target libdexfile

  # The management app (ui/) and the unsigned installer. Signing needs the
  # maintainer's certificate and is done on the release machine.
  ui:
    name: ui and installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-installer-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-installer-

      - name: Cache llvm-mingw
        uses: actions/cache@v4
        with:
          path: C:\tools\llvm-mingw
          key: llvm-mingw-${{ runner.arch }}-${{ hashFiles('xtask/src/toolchain.rs') }}

      - name: llvm-mingw
        run: cargo xtask toolchain

      - name: Cache NSIS
        uses: actions/cache@v4
        with:
          path: .cache/nsis-3.11
          key: nsis-3.11

      # Builds the Rust executables for x64 and arm64, publishes the manager
      # for both and builds one unsigned installer.
      - name: Installer
        run: ./installer/build.ps1 -Unsigned

      # After the installer step, so RealSysdTests runs against the
      # andruna-sysd.exe it built.
      - name: Test
        run: dotnet test ui/tests/Andruna.Manager.Tests -nologo

      - uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: target/installer/Andruna-*-setup-*.exe
          if-no-files-found: error

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
