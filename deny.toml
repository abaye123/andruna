# cargo-deny configuration. Run with `cargo deny check`.
# Only permissive licenses are allowed (ADR 0006).

[graph]
targets = [
    "x86_64-pc-windows-gnullvm",
    "aarch64-pc-windows-gnullvm",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = true

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are our own code under AGPL-3.0-only (ADR 0018) and are
# `publish = false`; the allow list above applies to dependencies only.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"
# andruna-pkg verifies APK signatures: public keys and public data only. Its
# shipped code never holds a private key, so timing side channels on secret
# values do not apply (ADR 0028). Test builds sign with throwaway keys.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa: private-key timing; andruna-pkg only verifies signatures (ADR 0028)" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5: timing on secret values; only public-key verification in shipped code (ADR 0028)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
