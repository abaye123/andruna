[package]
name = "andruna-spike-s1-art"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Spike S1 round 3: ART built as Android ELF, loaded with the S8 prototype loader"

# Standalone project: not a member of the root workspace.
[workspace]

[dependencies]
andruna-lx = { path = "../../../crates/andruna-lx" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Performance",
]

[profile.release]
debug = true
