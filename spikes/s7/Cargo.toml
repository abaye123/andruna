[package]
name = "andruna-spike-s7"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike S7: ART, D3D11 and DirectComposition inside an AppContainer; warm process strategies (throwaway prototype)"

# Standalone project: not a member of the root workspace.
[workspace]

[[bin]]
name = "s7"
path = "src/main.rs"

[dependencies]
andruna-ipc = { path = "../../crates/andruna-ipc" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
debug = 1
