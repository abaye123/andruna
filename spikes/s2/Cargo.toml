[package]
name = "andruna-spike-s2"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike S2: shared boot image mapping and GC fault primitives on Windows (throwaway prototype)"

# Standalone project: not a member of the root workspace.
[workspace]

[[bin]]
name = "s2"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1
