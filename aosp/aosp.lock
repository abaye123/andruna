# AOSP projects fetched by `cargo xtask fetch`.
#
# Every project is cloned shallowly at `tag` from `remote`/`name` into
# third_party/aosp/`path`. `commit` is the commit the tag resolves to (the
# peeled tag, `git ls-remote <url> refs/tags/<tag>^{}`); a fetch whose commit
# differs fails. Changing `tag` means refreshing every `commit` and checking
# every patch in patches/. `exclude` lists paths of a project that are not
# checked out (directories holding names Windows cannot store); see
# aosp/README.md. The tag choice is recorded in
# docs/decisions/0011-initial-aosp-tag.md.
#
# The initial set covers spike S1 (ART with libcore on andruna-lx). Add
# projects as later work needs them, in path order.

remote = "https://android.googlesource.com"
tag = "android-17.0.0_r1"

