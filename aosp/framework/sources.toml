# Directories of other AOSP projects the framework build uses, at the commit
# the pinned tag (aosp/aosp.lock: android-17.0.0_r1) resolves to in each
# project. aosp/framework/build.py downloads each directory from gitiles
# (`<project>/+archive/<commit>/<dir>.tar.gz`) into out/framework/deps. These
# are directories of large projects that the framework build needs only a
# small part of; whole projects are fetched by `cargo xtask fetch`
# (aosp.lock). ADR 0024.
#
# Keys:
#   jar             "framework": compiled into framework.jar, as Soong
#                   compiles these sources or static libraries into
#                   framework-minus-apex; "stub": compile-only (the API of a
#                   module that is its own jar on Android; stubgen.py keeps
#                   the signatures, nothing is packaged)
#   java            Java package roots
#   aidl            AIDL roots: every .aidl below is compiled to Java
#   aidl_versioned  frozen AIDL interface versions ({dir, version}), compiled
#                   with --structured --version and the frozen hash, as
#                   Soong's aidl_interface <name>-V<n>-java
#   aidl_include    AIDL import roots only (parcelable declarations)
#   aconfig         directories whose .aconfig declarations become flag
#                   classes (all flags disabled, like every other flag)

# --- APIs of mainline modules (compile-only) ------------------------------------

